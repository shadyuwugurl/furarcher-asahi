# Furarcher Asahi — Hyprland ("hyperland") for M1 Air 2560x1664, dark mode only
# Theme centre: boykisser + gay boys + furries + femboys, SFW. Dark everywhere.
# SUPER = Cmd key on Apple keyboards.

source = ~/.config/hypr/furarcher-colors.conf

monitor=eDP-1,2560x1664@60,0x0,2
monitor=,preferred,auto,1

env = GTK_THEME,adw-gtk3-dark
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = XCURSOR_SIZE,24

input {
  kb_layout = us
  follow_mouse = 1
  natural_scroll = true   # mac-like
  tap-to-click = true
  scroll_method = 2fg
}

general {
  gaps_in = 6
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(ff7ad9ee) rgba(b28dffee) 45deg
  col.inactive_border = rgba(444444aa)
  layout = dwindle
}

decoration {
  rounding = 12
  active_opacity = 1.0
  inactive_opacity = 0.95
  blur { enabled = true; size = 6; passes = 2; }
  shadow { enabled = true; range = 12; }
}

animations { enabled = true; }

dwindle { pseudotile = true; preserve_split = true; }

$terminal = kitty
$menu = wofi --show drun
$browser = firefox

# ---- macOS-style keybinds (SUPER = Cmd) ----
bind = SUPER, Space, exec, $menu            # Spotlight -> wofi
bind = SUPER, Return, exec, $terminal
bind = SUPER, T, exec, $terminal
bind = SUPER, N, exec, $browser
bind = SUPER, Q, killactive,                # Cmd+Q
bind = SUPER, W, killactive,                # Cmd+W close window
bind = SUPER, F, fullscreen,                # Cmd+F fullscreen-ish
bind = SUPER, M, fullscreen, 1              # Cmd+M maximise (monocle approx)
bind = SUPER, V, togglefloating,
bind = SUPER, H, movetoworkspacesilent, special  # Cmd+H hide approx
bind = SUPER, Tab, cyclenext,               # Cmd+Tab next window
bind = SUPER SHIFT, Tab, cyclenext, prev
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER, 1, workspace, 1               # Mission Control spaces
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, D, exec, $menu
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png  # Cmd+Shift+3 approx

# volume / brightness (M1 Air keys via wireplumber/brillo best-effort)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ---- autostart: top bar (mac menu bar) + bottom dock + dark wallpaper ----
exec-once = waybar -c ~/.config/waybar/furarcher-top.jsonc -s ~/.config/waybar/furarcher-top.css &
exec-once = waybar -c ~/.config/waybar/furarcher-dock.jsonc -s ~/.config/waybar/furarcher-dock.css &
exec-once = /usr/libexec/polkit-mate-authentication-agent-1 &
exec-once = systemctl --user restart pipewire wireplumber &
exec-once = wl-paste --watch cliphist store &
