# $M1 Air (2560x1664) - Furarcher Asahi experimental
# Keep simple: wlroots-safe on Asahi AGX. If flicker/tearing -> use GNOME.

monitor=eDP-1,2560x1664@60,0x0,2
# fallback
monitor=,preferred,auto,1

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

general {
  gaps_in = 6
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(ff7ad9ee) rgba(b28dffee) 45deg
  col.inactive_border = rgba(444444aa)
  layout = dwindle
}

decoration {
  rounding = 12
  blur {
    enabled = true
    size = 6
    passes = 2
  }
}

animations {
  enabled = true
}

$terminal = kitty
$menu = wofi --show drun

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,

exec-once = waybar &
exec-once = /usr/libexec/polkit-mate-authentication-agent-1 &

# audio on Asahi: pipewire
exec-once = systemctl --user restart pipewire wireplumber &
