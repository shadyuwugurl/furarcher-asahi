# furarcher kitty love snippet — dark, boykisser pink cursor, femboy tabs
# installed by `ricer dock`; included from kitty.conf via `include kitty-furarcher.conf`
cursor #ff7ad9
cursor_text_color #1a0e1a
selection_background #b28dff
selection_foreground #1a0e1a
tab_bar_style powerline
tab_powerline_style round
active_tab_background #ff7ad9
active_tab_foreground #1a0e1a
inactive_tab_background #2b1030
inactive_tab_foreground #e2d5ff
background_opacity 0.94
window_padding_width 8
font_size 12.0
