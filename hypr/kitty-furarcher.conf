# furarcher kitty love snippet — dark, boykisser pink cursor, femboy tabs
# installed by `ricer dock`; included from kitty.conf via `include kitty-furarcher.conf`
cursor #ff7ad9
cursor_text_color #1a0e1a
selection_background #b28dff
selection_foreground #1a0e1a
tab_bar_style powerline
tab_powerline_style round
active_tab_background #ff7ad9
active_tab_foreground #1a0e1a
inactive_tab_background #2b1030
inactive_tab_foreground #e2d5ff
background_opacity 0.94
window_padding_width 8
font_size 12.0

# ---- macOS keys (SUPER = Cmd). App-owned C/X/Z/A/S/P stay with apps, like macOS. ----
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+t new_tab
map super+n new_os_window
map super+w close_window
map super+f show_scrollback
map super+k clear_terminal reset active
map super+equal change_font_size all +2.0
map super+minus change_font_size all -2.0
map super+0 change_font_size all 0
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+9 goto_tab -1
